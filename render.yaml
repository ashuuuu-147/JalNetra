services:
  - type: web
    name: jalnetra-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: IMD_API_KEY
        sync: false
      - key: MOSDAC_USERNAME
        sync: false
      - key: NASA_EARTHDATA_TOKEN
        sync: false

  - type: web
    name: jalnetra-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jalnetra-api
          envVarKey: RENDER_EXTERNAL_URL
